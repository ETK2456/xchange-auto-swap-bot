name: xchange-auto-swap-bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Run bot
        env:
          FROM_CURRENCY: ${{ secrets.FROM_CURRENCY }}
          TO_CURRENCY: ${{ secrets.TO_CURRENCY }}
          FROM_AMOUNT: ${{ secrets.FROM_AMOUNT }}
          TO_ADDRESS: ${{ secrets.TO_ADDRESS }}
          REFUND_ADDRESS: ${{ secrets.REFUND_ADDRESS }}
          FF_API_KEY: ${{ secrets.FF_API_KEY }}
          FF_API_SECRET: ${{ secrets.FF_API_SECRET }}
        run: python bot.py
